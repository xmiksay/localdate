apiVersion: v1
kind: ConfigMap
metadata:
  name: letsgo
data:
  BIND_ADDR: "0.0.0.0:3000"
  RUST_LOG: info,sqlx=warn
  CLEANUP_INTERVAL_SECS: "300"
  # Photos go to a Garage bucket (#21). The key pair (S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY) comes
  # from the Secret `letsgo`. Garage only supports path-style addressing.
  PHOTO_STORAGE: s3
  S3_ENDPOINT: http://garage.services.svc:3900
  S3_REGION: garage
  # Set to your bucket name (the bucket the key in Secret `letsgo` can read + write).
  S3_BUCKET: letsgo
  # Traefik runs with hostNetwork on k8s-master, which holds the public IP, so it sees the real
  # client address. With no forwardedHeaders.trustedIPs / insecure set (the cluster sets neither)
  # it deletes any client-sent X-Forwarded-For and then appends the peer address, so the first
  # entry is the real client, which is what rate_limit::client_ip relies on. See README.md
  # "Client IP" before putting a load balancer in front or adding forwardedHeaders.* to Traefik.
  TRUST_PROXY_HEADERS: "true"
  # Alpha/beta testing: admins may act as any non-admin user (audited, see README "Impersonation").
  # To disable: set "false" and restart the pod; every impersonation token dies with it.
  ADMIN_IMPERSONATION: "true"
  # Public origin: OAuth redirect URIs and mailed links are built from it, so it must match exactly.
  APP_BASE_URL: https://letsgo.sc-l.eu
  # Only used once the Secret has SMTP_URL; the domain needs SPF/DKIM at the mail provider.
  EMAIL_FROM: letsgo <noreply@letsgo.sc-l.eu>
  # Only used once the Secret has both VAPID keys. The API refuses to start with keys but no
  # subject, so it is set up front.
  VAPID_SUBJECT: https://letsgo.sc-l.eu
