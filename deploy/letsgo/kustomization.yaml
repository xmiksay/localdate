# Example deployment of localdate at https://letsgo.sc-l.eu on the k8s-new cluster (Traefik,
# cert-manager, Postgres + Garage outside the cluster). Runbook: README.md in this directory.
# The Secret `letsgo` is created by hand and is NOT part of this kustomization;
# secret.example.yaml is a template only. Apply with `make deploy-letsgo`.
# `sites` is a shared namespace (blog, orechov, ...): it is deliberately NOT a resource here, so
# `kubectl delete -k` can never delete it. Every object name and selector below must stay unique there.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sites
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
