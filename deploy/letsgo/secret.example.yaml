# Template only: NOT in kustomization.yaml, never commit real values. Create the Secret straight
# from the shell instead (nothing touches disk), see README.md step 3.
#
# Required: DATABASE_URL, JWT_SECRET (at least 32 bytes). Everything else is optional; leave a key
# out to keep its feature off. Pairs are both-or-neither (the API refuses to start otherwise).
apiVersion: v1
kind: Secret
metadata:
  name: letsgo
  namespace: letsgo
type: Opaque
stringData:
  # postgres-direct (not the PgBouncer `postgres` Service, see deployment.yaml). Postgres accepts
  # cluster clients over TLS only. Keep the password URL-safe (openssl rand -hex 24).
  DATABASE_URL: "postgres://letsgo:REPLACE_WITH_openssl_rand_hex_24@postgres-direct.services.svc:5432/letsgo?sslmode=require"
  JWT_SECRET: "REPLACE_WITH_openssl_rand_hex_32"
  # Optional, email magic link + reset mails. lettre URL; percent-encode special characters.
  SMTP_URL: "smtps://USER:PASSWORD@smtp.example.com:465"
  # Optional, Sign in with Google.
  GOOGLE_CLIENT_ID: "REPLACE_WITH_xxx.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "REPLACE_WITH_google_client_secret"
  # Optional, Sign in with Telegram (BotFather → bot → Login Widget).
  TELEGRAM_CLIENT_ID: "REPLACE_WITH_botfather_login_widget_client_id"
  TELEGRAM_CLIENT_SECRET: "REPLACE_WITH_botfather_login_widget_client_secret"
  # Optional, password-reset links by Telegram message; must be the login bot's token.
  TELEGRAM_BOT_TOKEN: "REPLACE_WITH_123456789:botfather_token"
  # Optional, Facebook login.
  FACEBOOK_APP_ID: "REPLACE_WITH_facebook_app_id"
  FACEBOOK_APP_SECRET: "REPLACE_WITH_facebook_app_secret"
  # Optional, Web Push (`make vapid-keys`).
  VAPID_PUBLIC_KEY: "REPLACE_WITH_make_vapid-keys_public"
  VAPID_PRIVATE_KEY: "REPLACE_WITH_make_vapid-keys_private"
