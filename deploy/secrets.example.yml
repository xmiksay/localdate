# Template only — never commit real values. Prefer creating the Secret straight from the shell
# (nothing touches disk), see docs/deployment.md:
#
#   kubectl -n localdate create secret generic localdate \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)"
#
# POSTGRES_PASSWORD is interpolated into DATABASE_URL, so keep it URL-safe (hex is).
# JWT_SECRET must be at least 32 bytes.
# SMTP_URL is optional (email login is off without it); add it later with
#   kubectl -n localdate patch secret localdate --type merge -p '{"stringData":{"SMTP_URL":"smtps://…"}}'
# GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET (optional, Sign in with Google): both or neither.
# TELEGRAM_CLIENT_ID / TELEGRAM_CLIENT_SECRET (optional, Sign in with Telegram): both or neither.
# TELEGRAM_BOT_TOKEN (optional): the bot sends password-reset links; omit to reset by email only.
# VAPID_* (optional, Web Push): `make vapid-keys` prints a pair; omit both to keep push off.
apiVersion: v1
kind: Secret
metadata:
  name: localdate
  namespace: localdate
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_WITH_openssl_rand_hex_24"
  JWT_SECRET: "REPLACE_WITH_openssl_rand_hex_32"
  # lettre URL with credentials; percent-encode special characters in user/password.
  SMTP_URL: "smtps://USER:PASSWORD@smtp.example.com:465"
  GOOGLE_CLIENT_ID: "REPLACE_WITH_xxx.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "REPLACE_WITH_google_client_secret"
  TELEGRAM_CLIENT_ID: "REPLACE_WITH_botfather_login_widget_client_id"
  TELEGRAM_CLIENT_SECRET: "REPLACE_WITH_botfather_login_widget_client_secret"
  TELEGRAM_BOT_TOKEN: "REPLACE_WITH_123456789:botfather_token"
  VAPID_PUBLIC_KEY: "REPLACE_WITH_make_vapid-keys_public"
  VAPID_PRIVATE_KEY: "REPLACE_WITH_make_vapid-keys_private"
