# Template only — never commit real values. Prefer creating the Secret straight from the shell
# (nothing touches disk), see docs/deployment.md:
#
#   kubectl -n localdate create secret generic localdate \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)"
#
# POSTGRES_PASSWORD is interpolated into DATABASE_URL, so keep it URL-safe (hex is).
# JWT_SECRET must be at least 32 bytes.
apiVersion: v1
kind: Secret
metadata:
  name: localdate
  namespace: localdate
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_WITH_openssl_rand_hex_24"
  JWT_SECRET: "REPLACE_WITH_openssl_rand_hex_32"
